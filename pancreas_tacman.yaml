# STAR Protocols TACMAN pancreas example.
# Edit paths to match the local project layout.
reference:
  h5ad: ../data/pancreas_h/counts.h5ad
  species: human
  cell_type_key: cell_type

query:
  h5ad: ../data/pancreas_m/counts.h5ad
  species: mouse

homology:
  info_csv: null
  path: ../homo/human_to_mouse.txt
  is_1v1: false

analysis:
  tissue: pancreas
  aligned: true
  stages: [100, 100, 100]

output:
  directory: ../output
  tag: pan_h-map-pan_m
  overwrite: false

runtime:
  seed: 0
  log_level: INFO
